apiVersion: apps/v1
kind: Deployment
metadata:
  name: condrox-api
  namespace: condrox
  labels:
    app: condrox-api
    app.kubernetes.io/name: condrox-api
    app.kubernetes.io/part-of: condrox
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: condrox-api
  template:
    metadata:
      labels:
        app: condrox-api
        app.kubernetes.io/name: condrox-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: condrox-api:3.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: condrox-config
            - secretRef:
                name: condrox-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Readiness probe — pod accepts traffic only when healthy
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness probe — restart pod if unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Startup probe — give time for boot before liveness kicks in
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: knowledge-data
              mountPath: /data/knowledge
              readOnly: true
      volumes:
        - name: knowledge-data
          persistentVolumeClaim:
            claimName: condrox-knowledge-pvc
