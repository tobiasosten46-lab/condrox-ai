apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: condrox-api
  namespace: condrox
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.condrox.example.com
      secretName: condrox-tls
  rules:
    - host: api.condrox.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: condrox-api
                port:
                  number: 80
